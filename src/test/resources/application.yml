spring:
  config:
    # Spring Cloud Config (2020.0+) requires an explicit import; make it optional so
    # tests boot without a running config server.
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  datasource:
    url: "jdbc:mysql://localhost:3306/wotos_players_test_database?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true"
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

eureka:
  client:
    enabled: false

env:
  app_id: ""
  snapshot_rate: 0
  urls:
    world_of_tanks_api: "http://localhost"
    xvm_expected_statistics: "http://localhost"
